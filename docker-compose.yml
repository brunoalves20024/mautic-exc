version: '3.8'

services:
  mautic:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./config:/var/www/html/config
      - ./var/logs:/var/www/html/var/logs
      - ./media:/var/www/html/media
    environment:
      - MAUTIC_DB_HOST=db
      - MAUTIC_DB_USER=root
      - MAUTIC_DB_PASSWORD=mautic
      - MAUTIC_DB_NAME=mautic
      - MAUTIC_URL=http://localhost:8080
      - MAUTIC_REDIS_HOST=redis
      - MAUTIC_REDIS_PORT=6379
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=mautic
      - MYSQL_DATABASE=mautic
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
